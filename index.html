<!DOCTYPE html>
<html lang="it" class="h-full bg-stone-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library of Teachings Italia - Archivio Insegnamenti</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] },
            colors: {
                amber: { 50: '#fffbeb', 100: '#fef3c7', 600: '#d97706', 700: '#b45309', 800: '#92400e' },
                sand: { 50: '#fbf9f5', 100: '#f5f0e6', 200: '#e8dec9', 800: '#52493a', 900: '#363026' }
            } } } }
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="h-full text-stone-800 flex flex-col font-sans antialiased bg-stone-50 pb-12">

    <header class="sticky top-0 z-30 bg-sand-50/90 backdrop-blur-md border-b border-sand-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center h-20">
            <div class="flex items-center gap-3 cursor-pointer" onclick="showHome()">
                <div class="w-11 h-11 rounded-2xl bg-amber-700 text-white flex items-center justify-center shadow-md text-xl">🪷</div>
                <div>
                    <span class="block text-xl font-serif font-bold text-stone-900 leading-tight">Library of Teachings</span>
                    <span class="block text-xs text-amber-800 font-medium tracking-wide uppercase">Archivio Insegnamenti in Italiano</span>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">

        <div class="bg-white rounded-2xl p-4 sm:p-6 border border-sand-200 shadow-sm mb-10 max-w-3xl mx-auto">
            <label for="search" class="block text-xs font-bold uppercase tracking-wider text-amber-800 mb-2">
                <i class="fa-solid fa-magnifying-glass mr-1"></i> Ricerca rapida
            </label>
            <div class="relative flex items-center">
                <input type="text" id="search" placeholder="Un anno (1974), una data (1974-01-10), un luogo o un titolo..."
                    class="w-full pl-4 pr-24 py-3 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:border-amber-600 focus:bg-white transition"
                    onkeyup="if(event.key==='Enter')doSearch()">
                <button onclick="doSearch()" class="absolute right-2 px-4 py-1.5 bg-amber-700 hover:bg-amber-800 text-white text-xs font-semibold rounded-lg transition cursor-pointer">Cerca</button>
            </div>
        </div>

        <section id="home-view">
            <h2 class="text-2xl font-serif font-bold text-stone-900">Seleziona l'anno</h2>
            <p class="text-xs text-stone-500 mt-0.5 mb-4" id="home-subtitle"></p>
            <div id="years-grid" class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-11 gap-2.5"></div>
        </section>

        <section id="list-view" class="hidden space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-sand-100/70 p-6 rounded-2xl border border-sand-200">
                <div>
                    <button onclick="showHome()" class="inline-flex items-center gap-2 text-xs font-bold text-amber-800 bg-amber-100 hover:bg-amber-200 px-3 py-1.5 rounded-lg transition mb-2 cursor-pointer">
                        <i class="fa-solid fa-arrow-left"></i> Tutti gli anni
                    </button>
                    <h2 id="list-title" class="text-2xl font-serif font-bold text-stone-900"></h2>
                </div>
                <span id="list-count" class="self-start sm:self-auto text-xs font-semibold bg-stone-800 text-white px-3 py-1.5 rounded-xl"></span>
            </div>
            <div id="lessons-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            <p id="list-empty" class="hidden text-center py-16 text-stone-500 text-sm">Nessuna lezione trovata.</p>
        </section>
    </main>

    <div id="lesson-modal" class="fixed inset-0 z-50 overflow-y-auto bg-stone-900/60 backdrop-blur-sm hidden" onclick="if(event.target===this||event.target.dataset.close)closeLesson()">
        <div data-close="1" class="min-h-screen px-4 flex items-center justify-center py-6 sm:py-12">
            <div class="bg-sand-50 w-full max-w-3xl rounded-3xl overflow-hidden shadow-2xl border border-sand-200 relative">
                <div class="p-6 sm:p-8 bg-gradient-to-r from-stone-900 to-stone-800 text-white relative">
                    <button onclick="closeLesson()" class="absolute top-6 right-6 w-9 h-9 bg-white/10 hover:bg-white/20 rounded-full flex items-center justify-center transition cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
                    <p id="m-meta" class="text-xs text-stone-300 font-semibold mb-3 pr-12"></p>
                    <h2 id="m-title" class="text-2xl sm:text-3xl font-serif font-bold leading-tight pr-12"></h2>
                    <a id="m-link" target="_blank" rel="noopener" class="inline-flex items-center gap-2 text-stone-300 hover:text-white text-xs mt-4 transition">
                        <span>Vai alla lezione sul sito originale</span> <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    </a>
                </div>
                <div class="p-6 sm:p-8 space-y-6 max-h-[65vh] overflow-y-auto">
                    <div id="m-audio-box" class="bg-white p-4 rounded-2xl border border-sand-200 shadow-sm">
                        <h4 class="text-xs font-bold uppercase tracking-wider text-amber-800 mb-3"><i class="fa-solid fa-podcast mr-1"></i> Ascolta o scarica il podcast</h4>
                        <div class="flex flex-col sm:flex-row items-center gap-3">
                            <audio id="m-audio" controls preload="none" class="w-full flex-grow h-10"></audio>
                            <a id="m-download" download class="w-full sm:w-auto inline-flex items-center justify-center gap-1.5 bg-amber-700 hover:bg-amber-800 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition shrink-0">
                                <i class="fa-solid fa-download"></i> Scarica
                            </a>
                        </div>
                    </div>
                    <div id="m-sintesi" class="sintesi"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
